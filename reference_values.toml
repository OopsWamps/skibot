# 二维五项指标的三档参考区间（单位：度；过渡期口径，basis=2d）
#
# ⚠️ 数值来源（2026-10-20 产品负责人批准）：
#   advanced  = EPFL Ski2DPose 世界杯竞技者人工标注的 p25~p75（全程跨相位粗带，
#               见 datasets/epfl_ski2dpose/gt_angle_stats.json）——是数据，不是教练结论；
#   novice/intermediate = 仍是公开教学体系定性描述转译的占位值，待专业确认。
# 教练逐项确认之前，报告一律输出"参考值未校准"水印。
# TODO(睿君/教练): 逐项确认/修改以下数值，确认后删除本注释块。
#
# 角度约定（与 Sports2D 一致）：
#   hip_flexion        肩-髋-膝夹角，直立 ≈180°，屈髋变小
#   knee_flexion       髋-膝-踝夹角，直立 ≈180°，屈膝变小
#   trunk_lean         躯干节段与竖直方向偏角，直立 ≈0°
#   knee_abduction     二维投影：髋-膝-踝夹角，腿直 ≈180°，内扣变小
#                      （旧名 knee_valgus 作别名保留；三维 JCS 定义见 ADR-0001 §5.5）
#   shoulder_hip_align 旧合并口径：肩线与髋线夹角，对齐 ≈0°
#                      三维拆成 hip_shoulder_separation 与 thoraco_pelvic_obliquity
#
# 二期三维六项指标的相位带由 ADR-0002 生成，尚未写入本文件；本文件的带
# 全部是二维口径，报告以 basis=2d 标注。

[hip_flexion.novice]
range = [135, 165]
verdict_low = "屈髋过度，重心过于靠后，检查是否坐姿滑行"
verdict_high = "屈髋不足，躯干过直，想象胸前抱住一个圆球"
verdict_ok = "屈髋幅度在参考区间内"

[hip_flexion.intermediate]
range = [140, 160]

[hip_flexion.advanced]  # 竞技 p25~p75：65.9~135.1
range = [66, 135]

[knee_flexion.novice]
range = [140, 170]
verdict_low = "屈膝过深且不稳定，注意踝膝髋三关节联动"
verdict_high = "膝盖太直，没有吸收地形冲击的余地，下压脚踝屈膝"
verdict_ok = "膝关节弯曲在参考区间内"

[knee_flexion.intermediate]
# 文献锚点（docs/lit_angle_values.md）：Bon et al. 2021（9 名滑雪教练，20° 坡）
# PT 弯末外侧膝角 141.5~148.7°——弯末为屈膝最深时刻，全程中位应高于此值，
# 带下沿 145 与文献自洽（2026-10-21 检索）。
range = [145, 165]

[knee_flexion.advanced]  # 竞技 p25~p75：96.9~153.1
range = [97, 153]

[trunk_lean.novice]
range = [5, 25]
verdict_low = "躯干几乎垂直，重心偏后，小腿应迎向雪鞋前壁"
verdict_high = "躯干前倾过多，弯腰代替了屈髋，回到髋部折叠"
verdict_ok = "躯干前倾在参考区间内"

[trunk_lean.intermediate]
range = [8, 22]

[trunk_lean.advanced]  # 竞技 p25~p75：21.6~49.2
range = [22, 49]

[knee_abduction.novice]
range = [160, 180]
# 2026-10-21 AI 模拟教练评审（docs/coach_review_simulated.md）：正面髋-膝-踝夹角
# 含屈曲深度投影（advanced 带 [94,153] 与膝弯带 [97,153] 几乎重合为证），
# 不能把"小于 180°"直接解读为内扣错误。2026-10-23 已更名为 knee_abduction，
# 本节仍是二维投影口径；三维 JCS 带待 issue 12。
verdict_low = "正面膝角低于参考带（含屈膝深度的投影成分，不等同于内扣错误，请结合标注视频自查）"
verdict_high = "正面膝角高于参考带（比参考带更接近伸直）"
verdict_ok = "正面膝角在参考带内（作描述统计参考，不等同于力线判定）"

[knee_abduction.intermediate]
range = [165, 180]

[knee_abduction.advanced]  # 竞技 p25~p75：94.2~152.7
range = [94, 153]

# 遗留二维合并口径；三维拆成 H-SEP 与 obliquity（ADR-0001 §5.6/5.7）。
[shoulder_hip_align.novice]
range = [0, 20]
verdict_high = "肩髋旋转错位大，上身与下身脱节，先转髋再带动肩"
verdict_ok = "肩髋对齐在参考区间内"

[shoulder_hip_align.intermediate]
range = [0, 15]

[shoulder_hip_align.advanced]  # 竞技 p25~p75：4.1~15.2
range = [4, 15]
