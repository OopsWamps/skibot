[project]
name = "skibot"
version = "0.1.0"
description = "滑雪视频体态分析：视频进，关节角度与体态报告出"
requires-python = ">=3.11"
dependencies = [
    "sports2d>=0.8.31",
    "opencv-python>=4.8,<5",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.5",                                  # scripts/download_user_footage.py 的 ffmpeg 来源
    "onnxruntime-directml>=1.19; sys_platform == 'win32'",  # GPU 推理；装后跑 scripts/patch_rtmlib_dml.py（DECISIONS 6）
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",                              # 文件上传
]

[project.optional-dependencies]
test = ["httpx>=0.27"]                                      # fastapi TestClient
lift3d = ["torch>=2.0"]                                     # 三维提升（CUDA 构建另加 --index-url https://download.pytorch.org/whl）

[project.scripts]
skibot = "skibot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
